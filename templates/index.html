<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IF-AROMAN – Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #e8f0ff, #f0fff4);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .card {
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="card text-center">
    <h2 class="text-primary mb-4">🌿 Welcome to IF-AROMAN Evaluation System</h2>
    <p class="mb-4">Evaluate vegan restaurants based on multiple criteria and fuzzy logic scoring.</p>
    <div class="d-flex justify-content-center gap-3">
        <a href="/evaluate" class="btn btn-success px-4 py-2">Start Evaluation</a>
        <a href="/admin-login" class="btn btn-outline-primary px-4 py-2">Admin Panel</a>
    </div>
</div>
</body>
</html>
