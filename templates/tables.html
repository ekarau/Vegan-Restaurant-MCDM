<!-- templates/tables.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Intermediate Result Tables</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">
    <h2 class="text-primary mb-4">📊 Intermediate Calculation Tables</h2>

    {% for table in tables %}
        <h4>{{ table.title }}</h4>
        <table class="table table-bordered table-sm mb-4">
            <thead class="table-light">
                <tr>
                    <th>#</th>
                    {% for col in table.headers %}
                        <th>{{ col }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% for row in table.rows %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        {% for cell in row %}
                            <td>{{ '%.4f' % cell }}</td>
                        {% endfor %}
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% endfor %}
</body>
</html>
